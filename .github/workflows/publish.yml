name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string


permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Kryptic.Daemon.Client.slnx

      - name: Build all target frameworks
        run: >
          dotnet build Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj
          --configuration Release
          --no-restore
          -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test Kryptic.Daemon.Client.slnx --configuration Release --no-restore

  publish:
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Resolve version from tag
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${DISPATCH_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3. Got: ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"


      - name: Set csproj version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj")
          version = os.environ["VERSION"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"<Version>[^<]+</Version>",
              f"<Version>{version}</Version>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one <Version> element in the csproj")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet restore Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj
          dotnet build Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:GeneratePackageOnBuild=false \
            -p:ContinuousIntegrationBuild=true
          dotnet pack Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:GeneratePackageOnBuild=false \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: python3 .github/scripts/release-notes-from-changelog.py

      - name: GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            gh release edit "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$(basename "$GITHUB_REPOSITORY") ${VERSION}" --notes-file "$NOTES_FILE" --verify-tag
          fi
