name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Incoming version override (leave empty to use the csproj Version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Kryptic.Daemon.Client.slnx

      - name: Build all target frameworks
        run: >
          dotnet build Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj
          --configuration Release
          --no-restore
          -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test Kryptic.Daemon.Client.slnx --configuration Release --no-restore

  publish:
    needs: test
    if: >
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Resolve package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION:-}" ]; then
            INCOMING="$INPUT_VERSION"
          elif [ "$EVENT_NAME" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            INCOMING="${TAG_NAME#v}"
          else
            INCOMING=""
          fi
          VERSION="$(python3 .github/scripts/resolve-package-version.py "${INCOMING}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${VERSION}"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet restore Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj
          dotnet build Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:GeneratePackageOnBuild=false \
            -p:ContinuousIntegrationBuild=true
          dotnet pack Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version="${VERSION}" \
            -p:PackageVersion="${VERSION}" \
            -p:GeneratePackageOnBuild=false \
            -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Commit version bump
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj")
          version = os.environ["VERSION"]
          text = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"<Version>[^<]+</Version>",
              f"<Version>{version}</Version>",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected exactly one <Version> element in the csproj")
          path.write_text(updated, encoding="utf-8")
          PY
          if git diff --quiet -- Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj; then
            echo "csproj already at ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kryptic.Daemon.Client/Kryptic.Daemon.Client.csproj
          git commit -m "chore: release ${VERSION}"
          git push
